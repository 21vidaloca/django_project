{% extends "baza.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 40px auto;">
    <h2>Schimbare Parolă</h2>
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label"><strong>{{ field.label }}</strong></label>
                {{ field }}
                {% if field.help_text %}
                    <small class="text-muted d-block">{{ field.help_text }}</small>
                {% endif %}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-success w-100">Salvează Noua Parolă</button>
        <a href="{% url 'profil' %}" class="btn btn-link w-100 mt-2">Înapoi la Profil</a>
    </form>
</div>
{% endblock %}
