<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Confirmare Cont</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto;">
        <tr>
            <td align="center" style="padding: 30px 20px; background-color: #2c3e50;">
                
                <img src="{{ /static/aplicatie/images/banner_home.png }}" 
                     alt="Logo Site" 
                     width="150" 
                     style="display: block; border: 0;">
                     
            </td>
        </tr>
        <h2 style="color: #2c3e50;">Salut, {{ username }}!</h2>
        
        <p>Îți mulțumim că te-ai înregistrat. Pentru a activa contul, te rugăm să confirmi adresa de e-mail.</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ link_confirmare }}" style="background-color: #27ae60; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold;">Confirmă E-mailul</a>
        </div>

        <p style="font-size: 12px; color: #777;">Dacă butonul nu funcționează, accesează acest link:<br> {{ link_confirmare }}</p>
    </div>
</body>
</html>
